# Docmost dùng Postgres + MinIO có sẵn trên server.
# Toàn bộ cấu hình/secret đặt trong file .env (cùng thư mục, đã được gitignore).
services:
  docmost:
    # Build từ source: bản này có custom S3_* env + S3_PREFIX,
    # image docmost/docmost:latest gốc KHÔNG đọc được các biến này.
    build: .
    image: vivoo/docmost:custom
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      # Redis chạy trong compose này, ghi đè giá trị trong .env
      REDIS_URL: 'redis://redis:6379'
    extra_hosts:
      # cho phép container gọi tới Postgres/MinIO đang chạy trên host
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - nesthouse # chung network với nesthouse-backend-postgres-1
    ports:
      - "3000:3000"
    restart: unless-stopped

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

networks:
  nesthouse:
    external: true
    # tên network của container postgres, kiểm tra bằng:
    # docker inspect nesthouse-backend-postgres-1 -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
    name: nesthouse-backend_default

volumes:
  redis_data:
